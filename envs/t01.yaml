MAILQUEUE_IXNAME4: IXLWD{{MAILQUEUE_TBNR}}4
# Security: FACILITY profiles (docs/02-use-cases.md, M7). The environments
# share one RACF database, so each has its own prefix.
ADMINRES: LWD.{{ENV}}.ADMIN
GROUPPREFIX: LWD.{{ENV}}.GRP
GROUPMINUTES: 15
# Deployment jobs
JOBPREFIX: LT
JOBCLASS: A
JOBMSGCLASS: X
# JES2 node name, first qualifier of JESSPOOL profiles ($D NODE);
# placeholder
JESNODE: N1
# Timing (A5)
APPROVALHOURS: 72
JOBMINUTES: 120
OUTPUTDAYS: 90
OUTPUTMAXLINES: 50000
# Mail (S5, docs/11-iteration-7.md): the JES writer and SYSOUT class
# CSSMTP reads (an empty MAILWRITER switches mail off), and the most
# mails the tick sends at a time
MAILFROM: lwd@example.com
MAILURL: https://example.com/lwdeploy
MAILWRITER: CSSMTP
MAILCLASS: A
MAILMAX: 50
# CICS (docs/05-iteration-1.md)
CICSHLQ: CICS63
CICSCSD: YINCIC.CPSM.{{ENV}}.DFHCSD
# Public: the web UI's files that load before sign-in (index.html, assets/,
# the login folder); no API path, plan DB2PLAN_PUBLIC (docs/09-iteration-5.md)
CICSTXN_PUBLIC: LWDP
CICSTXN_USER: LWDU
CICSTXN_ADMIN: LWDA
CICSTXN_SUBMIT: LWDS
CICSTXN_SCHED: LWDQ
CICSTXN_RESULT: LWDJ
CICSGRP: GLWD{{ENV}}
CICSLST: USRLIST
CICSLIB: LWDLIB
LOADLIB: '{{TGTHLQ}}.LOAD'
# REXX of the output collector (LWDTICK) and the result step, copied
# there by DEPLOY.zmake
EXECLIB: '{{TGTHLQ}}.EXEC'
# The result step calls LWD's REST API (docs/08-iteration-4.md): LWW's
# host and port, the API's path, and the key ring with the CAs of the
# certificates of LWW and Entra (*AUTH*/*: every CERTAUTH certificate).
# The values in <...> belong to the site: set them in
# envs/t01.local.yaml, which stays out of git (README).
LWDURL: https://<host>
LWDPORT: '<port>'
LWDPATH: /lwdeploy/API/v1
LWDKEYRING: '*AUTH*/*'
# It signs in with an Entra access token (docs/12-iteration-8.md): the
# tenant, the scope of LWD's API, and the Entra application of
# DEPLOYUSER, which LWW maps to it (placeholders). The client assertion
# comes from JWTSignerUtil (jwt_signer): Java and the directory with
# its jars, readable by every deploy userid.
ENTRATENANT: '<tenant ID>'
LWDAPISCOPE: '<application ID of the API>/.default'
DEPLOYAPPID: '<application ID of DEPLOYUSER>'
JAVAHOME: /usr/lpp/java/J21.0_64
JWTJARS: /var/lwd/t01/jwt
CICSREGIONUSER: STCMAS
CICSDFLTUSER: CICSUSER
# RACF: placeholders, see docs/05-iteration-1.md
ADMINGROUP: YINADMIN
USERGROUP: LWDUSER
SUBMITUSER: LWDSUBM
DEPLOYUSER: LWDDEPL
SCHEDUSER: LWDSCHD
# Its members may submit JCL as SCHEDUSER and su to it in USS; placeholder
SCHEDGROUP: YINADMIN
# The scheduled tick (JCL/LWDTICK): python/tick.py under SCHEDUSER.
# TICKDIR: the code, copied there by deploy.py (DEPLOY_ALL, DEPLOY_TICK):
# writable by the deployer, readable by SCHEDUSER. TICKCONFIG and the credentials
# it names: in SCHEDUSER's home, readable by SCHEDUSER only.
TICKHOME: /u/lwdschd
TICKDIR: /var/lwd/t01/tick
TICKCONFIG: /u/lwdschd/tick.json
PYTHONHOME: /usr/lpp/IBM/cyp/v3r13/pyz
TICKVENV: /u/lwdschd/venv
# Group of SUBMITUSER, DEPLOYUSER and SCHEDUSER: READ on the plan (MDSNPN)
DB2GROUP: LWD{{ENV}}
# Demo application of DDL/SEEDDATA.sql: its groups and target prefix
DEMOACCESSGROUP: LWDDEMO
DEMOOWNERGROUP: LWDOWNR
DEMOAPPROVERGROUP: LWDAPPR
DEMOHLQ: LWDDEPL.DEMO
# Build and deploy (python/build.py, python/deploy.py). BUILDHLQ and VERSION
# name the build libraries: <BUILDHLQ>.<VERSION>.COBOL, .LOAD, ... USERID is
# the userid running the script. Set your own in envs/<env>.local.yaml.
LWZMHLQ: YINSYS.LWZM020
BUILDHLQ: '{{USERID}}.LWD'
VERSION: V1
BUILDJOBCLASS: A
BUILDMSGCLASS: A
# Target libraries of the deploy: <TGTHLQ>.LOAD, .DBRM, .EXEC, .DDL, .JCL
TGTHLQ: YINCIC.CPSM.{{ENV}}.LWD
